# S1 Phase 4 — machine-checked reconciliation of Edge Function entrypoints.
# Every directory under database/supabase/functions/ that contains index.ts MUST appear exactly once.
#
# Classes (see docs/stages/S1-edge-function-org-authorization-enforcement.md §2.6):
#   public           — intentional anonymous / token-public surface (§2.3)
#   identity         — JWT-scoped identity helpers (§2.4)
#   privileged_batch — cron/batch HTTP; org-membership track deferred (§2.5 / G8)
#   alternate_auth   — authenticated but not body organization_id + shared helper pattern (§2.1)
#   secured          — MUST import a shared org gate (validated by scripts/validate-functions-inventory.ts)
#   secured_custom   — manual/resource-bound auth; exempt from import heuristic (human-maintained)
#
