# Composite action: Node + pnpm at repo root (--frozen-lockfile).
# Mirrors SCAINET's setup-node-app pattern for this monorepo.
name: Setup pnpm monorepo
description: Install Node, enable pnpm, and install workspace dependencies from the repo root

inputs:
  node-version:
    description: Node.js major version line (Active LTS)
    required: false
    # Node 20 Actions runtime is deprecated on GitHub runners; keep CI on Node 22 LTS.
    default: "22"

runs:
  using: composite
  steps:
    # Do not pass `version` here — package.json `packageManager` is the single
    # source of truth. pnpm/action-setup errors if both are set
    # ("Multiple versions of pnpm specified").
    - name: Setup pnpm
      uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
