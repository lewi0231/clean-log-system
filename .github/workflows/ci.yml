name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Next build + Vitest import graph evaluate Supabase client; real values come from hosting secrets.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key
  # mobile-app (Expo) reads EXPO_PUBLIC_* in lib/supabase.ts
  EXPO_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key

jobs:
  lint-and-build:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup pnpm monorepo
        uses: ./.github/actions/setup-pnpm-monorepo

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Cache Deno
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/deno
            database/supabase/functions/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('database/supabase/functions/**/deno.lock', 'database/supabase/functions/**/deno.json*', 'pnpm-lock.yaml') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Validate Edge Functions inventory (S1 Phase 4)
        run: pnpm validate:functions-inventory

      - name: Deno unit tests (Edge Functions, excludes integration)
        run: pnpm test:edge-unit

      - name: Prettier check (changed files — PR)
        if: github.event_name == 'pull_request'
        run: |
          FILES=$(git diff --name-only --diff-filter=d ${{ github.event.pull_request.base.sha }} ${{ github.sha }} \
            | grep -E '\.(js|jsx|ts|tsx|json|md|yml|yaml|css|mjs|cjs)$' || true)
          if [ -z "$FILES" ]; then
            echo "No matching files changed"
            exit 0
          fi
          echo "$FILES" | xargs pnpm exec prettier --check

      - name: Prettier check (changed files — push)
        if: github.event_name == 'push'
        run: |
          # Diff the whole push (all commits), not only HEAD~1..HEAD. Otherwise a batch push
          # can leave earlier commits' files unchecked; Prettier failures surface on the next
          # unrelated one-file commit (looks like "staging formatter is flaky").
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE_SPEC="single-commit fallback HEAD~1 HEAD"
            RANGE_ARGS=(HEAD~1 HEAD)
          else
            RANGE_SPEC="push range $BEFORE..${{ github.sha }}"
            RANGE_ARGS=("$BEFORE" "${{ github.sha }}")
          fi
          echo "Prettier file list: $RANGE_SPEC"
          FILES=$(git diff --name-only --diff-filter=d "${RANGE_ARGS[@]}" 2>/dev/null \
            | grep -E '\.(js|jsx|ts|tsx|json|md|yml|yaml|css|mjs|cjs)$' || true)
          if [ -z "$FILES" ]; then
            echo "No matching files changed in this push"
            exit 0
          fi
          echo "$FILES" | xargs pnpm exec prettier --check

      - name: Prettier check (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm format:check

      - name: ESLint (workspace)
        run: pnpm lint

      - name: Deno lint (Supabase edge functions)
        run: pnpm lint:edge-functions
        # Soft until Deno import graph lint is fully clean; still surfaces in logs.
        continue-on-error: true

      - name: TypeScript (packages that define typecheck)
        run: pnpm typecheck

      # Dashboard is only deployed to Vercel from `main` (no preview/staging deploy for cost).
      # Still run the Next build on PRs targeting `main` so broken builds are caught before merge.
      - name: Build dashboard (Next.js)
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: pnpm build:dashboard

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm monorepo
        uses: ./.github/actions/setup-pnpm-monorepo

      - name: Dashboard tests (with coverage + JUnit)
        working-directory: dashboard
        run: |
          pnpm exec vitest run \
            --coverage \
            --reporter=default \
            --reporter=junit \
            --outputFile=junit.xml

      - name: Mobile app tests
        working-directory: mobile-app
        run: pnpm exec vitest run --reporter=default --reporter=junit --outputFile=junit.xml

      - name: Upload dashboard test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-test-results
          path: |
            dashboard/junit.xml
            dashboard/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload mobile-app test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobile-app-test-results
          path: mobile-app/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  security-scan:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational until Dependabot clears the current high/critical backlog
    # (pnpm audit --audit-level=high fails today with dozens of transitive findings).
    # Still runs on every CI so the report is visible; does not gate "CI passed".
    # Flip to a hard gate by adding this job to ci-required when the audit is clean.

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm monorepo
        uses: ./.github/actions/setup-pnpm-monorepo

      - name: pnpm audit (high or critical)
        continue-on-error: true
        run: |
          if ! pnpm audit --audit-level=high; then
            echo "::warning::pnpm audit reported high/critical vulnerabilities. Informational only until Dependabot clears the backlog; does not block CI passed."
            exit 1
          fi

  # Single required status for branch rules / auto-merge consumers.
  # Auto-merge (PR → staging) and staging → main promotion both require this job.
  # When GitHub Pro/public rulesets are available, require check name: "CI passed"
  ci-required:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint-and-build, unit-tests]
    if: always()
    steps:
      - name: Require lint and unit tests to succeed
        run: |
          echo "lint-and-build: ${{ needs.lint-and-build.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          if [ "${{ needs.lint-and-build.result }}" != "success" ]; then
            echo "::error::lint-and-build did not succeed"
            exit 1
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "::error::unit-tests did not succeed"
            exit 1
          fi
          echo "All required CI jobs succeeded"

  e2e-tests:
    name: E2E tests (Playwright + Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Disabled: no staging/preview Vercel deploy for now — re-enable when a live non-prod URL is available
    # or when running E2E against CI-built localhost only (no deploy dependency).
    if: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm monorepo
        uses: ./.github/actions/setup-pnpm-monorepo

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        working-directory: database
        run: |
          supabase start
          sleep 10
          supabase status

      - name: Get Supabase credentials
        id: supabase
        working-directory: database
        run: |
          echo "SUPABASE_URL=$(supabase status --output json | jq -r '.API.URL')" >> $GITHUB_OUTPUT
          echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -r '.API.anon_key')" >> $GITHUB_OUTPUT
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.API.service_role_key')" >> $GITHUB_OUTPUT

      - name: Build dashboard for E2E
        working-directory: dashboard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.SUPABASE_ANON_KEY }}
        run: pnpm run build

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:3000
          SUPABASE_URL: ${{ steps.supabase.outputs.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Start the production server in background
          cd dashboard && pnpm start &
          sleep 5
          # Run E2E tests
          pnpm test:e2e --project=scenario-1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        working-directory: database
        run: supabase stop

  # Merge after CI passes for PRs targeting `staging`.
  #
  # Free / private-repo constraints:
  # - GitHub "Allow auto-merge" + required checks need Pro/public rulesets.
  # - Environment secrets are ignored on Free private repos.
  # - GITHUB_TOKEN can squash-merge ordinary PRs, but CANNOT merge PRs that
  #   change `.github/workflows/*` (needs a PAT with the `workflow` scope).
  # - GITHUB_TOKEN merges also do not start new push workflows.
  #
  # So we: try squash-merge with GITHUB_TOKEN; on workflow-permission blocks,
  # comment and succeed (manual merge). After a successful merge, dispatch CI
  # on staging and open/refresh the staging → main promotion PR.
  auto-merge-staging-pr:
    name: Auto-merge (PR → staging)
    runs-on: ubuntu-latest
    needs: [ci-required]
    if: >
      github.event_name == 'pull_request' &&
      github.base_ref == 'staging' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.ci-required.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Squash-merge into staging
        id: merge
        run: |
          set -euo pipefail
          PR_NUM=${{ github.event.pull_request.number }}
          REPO="${{ github.repository }}"
          STATE=$(gh pr view "$PR_NUM" --repo "$REPO" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUM is $STATE — nothing to merge"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          MERGE_OUT=$(gh pr merge "$PR_NUM" --squash --repo "$REPO" 2>&1)
          MERGE_EXIT=$?
          set -e
          echo "$MERGE_OUT"

          if [ "$MERGE_EXIT" -eq 0 ]; then
            echo "Merged PR #$PR_NUM into staging"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "merged=false" >> "$GITHUB_OUTPUT"

          # GITHUB_TOKEN cannot modify workflow files via mergePullRequest.
          if echo "$MERGE_OUT" | grep -qiE 'workflows permission|workflow `?\.github/workflows'; then
            gh pr comment "$PR_NUM" --repo "$REPO" --body "$(cat <<EOF
          ✅ **CI passed**, but Actions cannot auto-merge this PR.

          Reason: the diff updates \`.github/workflows/\` files, and \`GITHUB_TOKEN\` lacks the \`workflow\` scope.

          **Please squash-merge manually** (Merge pull request → Squash and merge). After merge, staging CI / the promotion PR will continue as usual for non-workflow changes; for workflow-only follow-ups, re-run or wait for the next feature PR.

          ---
          *Job: \`auto-merge-staging-pr\`*
          EOF
          )"
            echo "::notice::CI passed; manual merge required (workflow file changes)."
            exit 0
          fi

          gh pr comment "$PR_NUM" --repo "$REPO" --body "$(cat <<EOF
          ✅ **CI passed**, but auto-merge into staging failed:

          \`\`\`
          $MERGE_OUT
          \`\`\`

          Please squash-merge manually if the PR looks good.
          EOF
          )"
          echo "::warning::Auto-merge failed; left a PR comment. Not failing CI."
          exit 0

      - name: Trigger staging CI (GITHUB_TOKEN merges skip push workflows)
        if: steps.merge.outputs.merged == 'true'
        run: |
          if gh workflow run "CI" --ref staging --repo "${{ github.repository }}" 2>&1; then
            echo "Dispatched CI workflow on staging"
          else
            echo "::warning::Could not dispatch CI on staging — promotion PR step still runs."
          fi

      - name: Open or refresh staging → main promotion PR
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Staging tip may take a moment to update after merge.
          for i in 1 2 3 4 5; do
            STAGING_SHA=$(gh api "repos/$REPO/git/ref/heads/staging" --jq .object.sha)
            MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            if [ "$STAGING_SHA" != "$MAIN_SHA" ]; then
              break
            fi
            sleep 2
          done

          EXISTING=$(gh pr list --base main --head staging --state open --repo "$REPO" \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh pr comment "$EXISTING" --repo "$REPO" \
              --body "**Staging updated** after merge of #${{ github.event.pull_request.number }}. [CI run]($CI_RUN_URL)."
            echo "Refreshed existing promotion PR #$EXISTING"
            exit 0
          fi

          # Compare via API (no checkout needed).
          AHEAD=$(gh api "repos/$REPO/compare/main...staging" --jq '.ahead_by')
          if [ "$AHEAD" = "0" ]; then
            echo "staging is not ahead of main — no promotion PR"
            exit 0
          fi

          FILES=$(gh api "repos/$REPO/compare/main...staging" --jq '[.files[].filename] | length')
          set +e
          PR_URL=$(gh pr create \
            --base main \
            --head staging \
            --repo "$REPO" \
            --title "Staging → main ($FILES files)" \
            --body "$(cat <<EOF
          ## Promotion to main

          Opened after feature PR #${{ github.event.pull_request.number }} merged into staging.

          Review and merge manually when ready for production.

          **CI run:** $CI_RUN_URL

          **Ahead of main:** $AHEAD commit(s), ~$FILES file(s).

          ---
          *Job: \`auto-merge-staging-pr\` in \`.github/workflows/ci.yml\`*
          EOF
          )" 2>&1)
          CREATE_EXIT=$?
          set -e
          if [ "$CREATE_EXIT" -ne 0 ]; then
            echo "$PR_URL"
            echo "::error::Could not create staging → main PR. Enable Settings → Actions → General →"
            echo "::error::Workflow permissions → \"Allow GitHub Actions to create and approve pull requests\"."
            exit 1
          fi
          echo "Created promotion PR: $PR_URL"

  # When staging CI succeeds (push or workflow_dispatch), open/refresh staging → main.
  # Does NOT auto-merge into main — promotion PRs are reviewed manually.
  promote-staging-to-main:
    name: Staging → main (promotion PR)
    runs-on: ubuntu-latest
    needs: [ci-required]
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/staging' &&
      needs.ci-required.result == 'success'
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deep checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Check for existing promotion PR
        id: existing_pr
        run: |
          EXISTING=$(gh pr list \
            --base main \
            --head staging \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "open promotion PR #$EXISTING exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Gather diff (main..staging)
        id: details
        if: steps.existing_pr.outputs.exists == 'false'
        run: |
          git fetch origin main staging

          FILE_COUNT=$(git diff --name-only origin/main..origin/staging | wc -l | tr -d ' ')
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

          if [ "$FILE_COUNT" -eq "0" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "staging and main are aligned"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            CHANGED_FILES=$(git diff --name-only origin/main..origin/staging | head -40)
            {
              echo "CHANGED_FILES<<EOF"
              echo "$CHANGED_FILES"
              echo "EOF"
            } >> "$GITHUB_ENV"

            DIFF_SUMMARY=$(git diff --stat origin/main..origin/staging | tail -1)
            {
              echo "DIFF_SUMMARY<<EOF2"
              echo "$DIFF_SUMMARY"
              echo "EOF2"
            } >> "$GITHUB_ENV"
          fi

      - name: Create promotion PR
        if: steps.existing_pr.outputs.exists == 'false' && steps.details.outputs.has_changes == 'true'
        run: |
          FILE_COUNT=${{ steps.details.outputs.file_count }}
          CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          set +e
          PR_URL=$(gh pr create \
            --base main \
            --head staging \
            --repo "${{ github.repository }}" \
            --title "Staging → main ($FILE_COUNT files)" \
            --body "$(cat <<EOF
          ## Promotion to main

          **CI succeeded** on staging: [workflow run]($CI_RUN_URL)

          Review and merge manually when ready for production.

          **Scope:** ~$FILE_COUNT file(s).

          ### Files (first segment)
          \`\`\`
          $CHANGED_FILES
          \`\`\`

          ### Stat
          $DIFF_SUMMARY

          ---
          *Job: \`promote-staging-to-main\` in \`.github/workflows/ci.yml\`*
          EOF
          )" 2>&1)
          CREATE_EXIT=$?
          set -e

          if [ "$CREATE_EXIT" -ne 0 ]; then
            echo "$PR_URL"
            echo "::error::GitHub refused PR creation. Enable Settings → Actions → General →"
            echo "::error::Workflow permissions → \"Allow GitHub Actions to create and approve pull requests\"."
            exit 1
          fi

          echo "promotion PR: $PR_URL"

      - name: Comment on existing promotion PR
        if: steps.existing_pr.outputs.exists == 'true'
        run: |
          PR_NUM=${{ steps.existing_pr.outputs.pr_number }}
          CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr comment "$PR_NUM" --repo "${{ github.repository }}" \
            --body "**CI passed again on staging:** [workflow run]($CI_RUN_URL)."

  notify-failure:
    name: Notify build failure
    runs-on: ubuntu-latest
    needs: [lint-and-build, unit-tests, security-scan, ci-required]
    if: failure()
    permissions:
      contents: write

    steps:
      - name: Post commit comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const jobResults = {
              'lint-and-build': '${{ needs.lint-and-build.result }}',
              'unit-tests': '${{ needs.unit-tests.result }}',
              'security-scan': '${{ needs.security-scan.result }}',
              'ci-required': '${{ needs.ci-required.result }}',
            };
            const failed = Object.entries(jobResults)
              .filter(([, r]) => r === 'failure')
              .map(([job]) => job);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }}`;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const commitMsg =
              (context.payload.head_commit?.message || '').split(/\r?\n/).shift() ||
              '(no message)';
            const branch = '${{ github.ref_name }}';
            const codeBlock = [
              '```bash',
              'pnpm install',
              'pnpm validate:functions-inventory',
              'pnpm lint && pnpm lint:edge-functions',
              'pnpm typecheck && pnpm build:dashboard',
              'pnpm --filter @clean-log/dashboard exec vitest run',
              'pnpm --filter @clean-log/mobile-app exec vitest run',
              '```',
            ].join('\n');
            const body = [
              '## CI failed',
              '',
              `- **Branch:** \`${branch}\``,
              `- **Commit:** [${context.sha.substring(0, 7)}](${commitUrl})`,
              `- **Message:** ${commitMsg}`,
              '',
              '### Failed jobs',
              ...failed.map((j) => `- ${j}`),
              '',
              `[Workflow run](${runUrl})`,
              '',
              '### Local verification',
              codeBlock,
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
