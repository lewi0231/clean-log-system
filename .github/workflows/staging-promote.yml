# After CI succeeds on a **push** to `staging`, open (or refresh) staging → main
# promotion PR if there are changes. Humans still approve/merge production.
#
# Diff from SCAINET: this repo does not run staging E2E in CI yet, so copy refers
# to CI passing—not remote Playwright against a staging URL.

name: Staging → main (promotion PR)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    name: Create or refresh production promotion PR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'staging'

    env:
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Check for existing promotion PR
        id: existing_pr
        run: |
          EXISTING=$(gh pr list \
            --base main \
            --head staging \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "open promotion PR #$EXISTING exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Gather diff details
        if: steps.existing_pr.outputs.exists == 'false'
        id: details
        run: |
          git fetch origin main staging

          FILE_COUNT=$(git diff --name-only origin/main..origin/staging | wc -l | tr -d ' ')
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

          if [ "$FILE_COUNT" -eq "0" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "staging and main are aligned"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            CHANGED_FILES=$(git diff --name-only origin/main..origin/staging | head -40)
            {
              echo "CHANGED_FILES<<EOF"
              echo "$CHANGED_FILES"
              echo "EOF"
            } >> "$GITHUB_ENV"

            DIFF_SUMMARY=$(git diff --stat origin/main..origin/staging | tail -1)
            {
              echo "DIFF_SUMMARY<<EOF2"
              echo "$DIFF_SUMMARY"
              echo "EOF2"
            } >> "$GITHUB_ENV"
          fi

      - name: Create promotion PR
        if: steps.existing_pr.outputs.exists == 'false' && steps.details.outputs.has_changes == 'true'
        id: create_pr
        run: |
          FILE_COUNT=${{ steps.details.outputs.file_count }}
          CI_RUN_URL="${{ github.event.workflow_run.html_url }}"

          PR_URL=$(gh pr create \
            --base main \
            --head staging \
            --title "Staging → main ($FILE_COUNT files)" \
            --body "$(cat <<EOF
          ## Promotion to main

          **CI succeeded** on staging: [workflow run]($CI_RUN_URL)

          **Scope:** ~$FILE_COUNT file(s).

          ### Files (first segment)
          \`\`\`
          $CHANGED_FILES
          \`\`\`

          ### Stat
          $DIFF_SUMMARY

          ---
          *Workflow: \`.github/workflows/staging-promote.yml\`*
          EOF
          )")

          echo "promotion PR: $PR_URL"
          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Enable auto-merge (--merge preserves SHAs)
        if: steps.existing_pr.outputs.exists == 'false' && steps.details.outputs.has_changes == 'true'
        run: |
          PR_NUM=${{ steps.create_pr.outputs.pr_number }}
          if gh pr merge "$PR_NUM" --auto --merge 2>&1; then
            echo "auto-merge enabled on PR #$PR_NUM"
          elif gh pr merge "$PR_NUM" --merge 2>&1; then
            echo "merged PR #$PR_NUM immediately"
          else
            echo "PR created — enable Allow auto-merge in repo settings if you want bots to merge"
          fi

      - name: Re-enable auto-merge on existing promotion PR
        if: steps.existing_pr.outputs.exists == 'true'
        run: |
          PR_NUM=${{ steps.existing_pr.outputs.pr_number }}
          if gh pr merge "$PR_NUM" --auto --merge 2>&1; then
            echo "auto-merge on PR #$PR_NUM"
          elif gh pr merge "$PR_NUM" --merge 2>&1; then
            echo "merged PR #$PR_NUM immediately"
          else
            echo "could not change merge state"
          fi

      - name: Comment on existing promotion PR
        if: steps.existing_pr.outputs.exists == 'true'
        run: |
          PR_NUM=${{ steps.existing_pr.outputs.pr_number }}
          CI_RUN_URL="${{ github.event.workflow_run.html_url }}"
          gh pr comment "$PR_NUM" \
            --body "**CI passed again on staging:** [workflow run]($CI_RUN_URL)."
