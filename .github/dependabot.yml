# Dependabot — version updates for npm workspaces + GitHub Actions.
# Version-update PRs target `staging` (below). This file must also exist on the
# default branch (`main`) for Dependabot to load it — promote staging → main
# after changing this config.
#
# Policy (Free private repo / pnpm monorepo):
# - Prefer ONE curated dependency PR over many lockfile-conflicting Dependabot PRs.
# - Only grouped minor/patch. All majors ignored (done manually).
# - Security auto-PRs stay off; use alerts + a dedicated cleanup PR for CVEs.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Root + workspace packages (pnpm lockfile)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Adelaide
    # Keep the queue tiny so PRs don't thrash pnpm-lock.yaml against each other
    open-pull-requests-limit: 3
    target-branch: staging
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: auto
    versioning-strategy: increase
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Never open major bumps via Dependabot (Expo, Next, TS, etc.)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in workflows / composite actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Australia/Adelaide
    open-pull-requests-limit: 1
    target-branch: staging
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    rebase-strategy: auto
    groups:
      actions:
        patterns:
          - "*"
