# =============================================================================
# CONFIGURATION
# =============================================================================
config:
  ambiguity_handling: "ask_user" # ask_user | best_guess | fail
  confirmation_style: "inline" # inline | modal | skip
  role_detection: "auto" # auto | explicit | default_ceo
  default_time_range: "48h"
  enable_learning: true # Allow agent to suggest new commands
  strict_mode: false # If true, only recognize defined commands
